<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MoveBall 用例预览</title>
        <style>
            #d1,
            #d2,
            #d3 {
                width: 100px;
                height: 100px;
            }
            #d1 {
                background: lightsalmon;
                position: fixed;
                top: 30%;
                cursor: pointer;
            }
            #d2 {
                background: lightblue;
                position: fixed;
                top: 80%;
                left: 0;
                cursor: pointer;
            }
            #d3 {
                background: red;
                position: fixed;
                top: 50%;
                left: 50%;
            }
        </style>
    </head>
    <body>
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <script>
            // MoveBall.js（与文章一致）
            class MoveBall {
                constructor({ startDom, endDom, duration, ballSize, color, verticalEasing }) {
                    this.startDom = startDom;
                    this.endDom = endDom;
                    this.duration = duration !== undefined ? duration : 500;
                    this.ballSize = ballSize !== undefined ? ballSize : 30;
                    this.color = color !== undefined ? color : 'lightgreen';
                    this.verticalEasing = verticalEasing;
                }
                static getCenterCoordinates(domElement) {
                    const rect = domElement.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    return { x: centerX, y: centerY };
                }
                createVerticalDom(startXy) {
                    const verticalDom = document.createElement('div');
                    verticalDom.style.position = 'fixed';
                    verticalDom.style.top = `${startXy.y - this.ballSize / 2}px`;
                    verticalDom.style.left = `${startXy.x - this.ballSize / 2}px`;
                    verticalDom.style.zIndex = '999';
                    return verticalDom;
                }
                createHorizontalDom() {
                    const horizontalDom = document.createElement('div');
                    horizontalDom.style.width = `${this.ballSize}px`;
                    horizontalDom.style.height = `${this.ballSize}px`;
                    horizontalDom.style.borderRadius = '50%';
                    horizontalDom.style.background = this.color;
                    return horizontalDom;
                }
                freeThrow() {
                    const startXy = MoveBall.getCenterCoordinates(this.startDom);
                    const endXy = MoveBall.getCenterCoordinates(this.endDom);
                    const offsetX = endXy.x - startXy.x;
                    const offsetY = endXy.y - startXy.y;

                    const verticalDom = this.createVerticalDom(startXy);
                    const horizontalDom = this.createHorizontalDom();
                    verticalDom.appendChild(horizontalDom);
                    document.body.appendChild(verticalDom);

                    let verticalEasing = this.verticalEasing;
                    if (verticalEasing === undefined) {
                        verticalEasing =
                            startXy.y < endXy.y
                                ? 'cubic-bezier(0.49, -0.29, 0.75, 0.41)'
                                : 'cubic-bezier(0.2, 0, 0.8, 1.35)';
                    }

                    const verticalAnimate = verticalDom.animate(
                        [{ transform: `translate3d(0, ${offsetY}px, 0)` }],
                        {
                            easing: verticalEasing,
                            duration: this.duration,
                            iterations: 1,
                        }
                    );
                    horizontalDom.animate([{ transform: `translate3d(${offsetX}px, 0, 0)` }], {
                        easing: 'linear',
                        duration: this.duration,
                        iterations: 1,
                    });
                    verticalAnimate.onfinish = () => {
                        verticalDom.remove();
                    };
                }
            }

            const d1 = document.getElementById('d1');
            const d2 = document.getElementById('d2');
            const d3 = document.getElementById('d3');
            d1.onclick = function (e) {
                let moveball = new MoveBall({
                    startDom: d1,
                    endDom: d3,
                });
                moveball.freeThrow();
            };
            d2.onclick = function (e) {
                let moveball = new MoveBall({
                    startDom: d2,
                    endDom: d3,
                    duration: 500,
                    ballSize: 30,
                    color: 'lightgreen',
                });
                moveball.freeThrow();
            };
        </script>
    </body>
</html>
