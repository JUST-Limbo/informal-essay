<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MoveBall 斜抛动画 Demo</title>
        <style>
            :root {
                --bg: #f3efe6;
                --ink: #1c1a17;
                --muted: #5c564c;
                --cart: #c45c26;
                --a: #d9784a;
                --b: #3d7ea6;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
                color: var(--ink);
                background:
                    radial-gradient(ellipse 80% 50% at 20% 10%, #fff8e8 0%, transparent 55%),
                    radial-gradient(ellipse 60% 40% at 90% 80%, #e8f0f4 0%, transparent 50%),
                    var(--bg);
            }
            header {
                padding: 28px 24px 8px;
                max-width: 720px;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 1.35rem;
                font-weight: 650;
            }
            p {
                margin: 0;
                color: var(--muted);
                font-size: 0.92rem;
                line-height: 1.5;
            }
            .stage {
                position: relative;
                height: calc(100vh - 120px);
                min-height: 420px;
            }
            .box {
                width: 96px;
                height: 96px;
                border: 0;
                border-radius: 10px;
                color: #fff;
                font-size: 0.85rem;
                font-weight: 600;
                cursor: pointer;
                box-shadow: 0 10px 24px rgba(28, 26, 23, 0.12);
            }
            .box:active {
                transform: scale(0.97);
            }
            #start-high {
                position: fixed;
                top: 42%;
                left: calc(50% - 170px);
                background: var(--a);
            }
            #start-low {
                position: fixed;
                top: 56%;
                left: calc(50% - 170px);
                background: var(--b);
            }
            #cart {
                position: fixed;
                top: 48%;
                left: calc(50% + 20px);
                width: 110px;
                height: 110px;
                background: var(--cart);
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                line-height: 1.35;
                pointer-events: none;
            }
            .hint {
                position: fixed;
                left: calc(50% + 20px);
                top: calc(48% + 118px);
                width: 110px;
                text-align: center;
                font-size: 0.78rem;
                color: var(--muted);
            }
            .meta {
                position: fixed;
                left: 24px;
                bottom: 20px;
                font-size: 0.8rem;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.7);
                padding: 8px 12px;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>购物车小球斜抛 · Demo</h1>
            <p>点左侧色块飞向右侧「购物车」。上块走「上→下」缓动，下块走「下→上」缓动。</p>
        </header>
        <div class="stage">
            <button class="box" id="start-high" type="button">上→下<br />加购常见</button>
            <button class="box" id="start-low" type="button">下→上<br />过冲回落</button>
            <div id="cart">购物车<br />终点</div>
            <div class="hint" id="last-easing">上次缓动：—</div>
        </div>
        <div class="meta">默认 duration=500 · ballSize=30</div>

        <script>
            class MoveBall {
                constructor({ startDom, endDom, duration, ballSize, color, verticalEasing }) {
                    this.startDom = startDom;
                    this.endDom = endDom;
                    this.duration = duration !== undefined ? duration : 500;
                    this.ballSize = ballSize !== undefined ? ballSize : 30;
                    this.color = color !== undefined ? color : 'lightgreen';
                    this.verticalEasing = verticalEasing;
                }
                static getCenterCoordinates(domElement) {
                    const rect = domElement.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    return { x: centerX, y: centerY };
                }
                createVerticalDom(startXy) {
                    const verticalDom = document.createElement('div');
                    verticalDom.style.position = 'fixed';
                    verticalDom.style.top = startXy.y - this.ballSize / 2 + 'px';
                    verticalDom.style.left = startXy.x - this.ballSize / 2 + 'px';
                    verticalDom.style.zIndex = '999';
                    return verticalDom;
                }
                createHorizontalDom() {
                    const horizontalDom = document.createElement('div');
                    horizontalDom.style.width = this.ballSize + 'px';
                    horizontalDom.style.height = this.ballSize + 'px';
                    horizontalDom.style.borderRadius = '50%';
                    horizontalDom.style.background = this.color;
                    return horizontalDom;
                }
                freeThrow() {
                    const startXy = MoveBall.getCenterCoordinates(this.startDom);
                    const endXy = MoveBall.getCenterCoordinates(this.endDom);
                    const offsetX = endXy.x - startXy.x;
                    const offsetY = endXy.y - startXy.y;

                    const verticalDom = this.createVerticalDom(startXy);
                    const horizontalDom = this.createHorizontalDom();
                    verticalDom.appendChild(horizontalDom);
                    document.body.appendChild(verticalDom);

                    let verticalEasing = this.verticalEasing;
                    if (verticalEasing === undefined) {
                        verticalEasing =
                            startXy.y < endXy.y
                                ? 'cubic-bezier(0.49, -0.29, 0.75, 0.41)'
                                : 'cubic-bezier(0.2, 0, 0.8, 1.35)';
                    }

                    const hint = document.getElementById('last-easing');
                    hint.textContent = '上次缓动：' + verticalEasing;

                    const verticalAnimate = verticalDom.animate(
                        [{ transform: 'translate3d(0, ' + offsetY + 'px, 0)' }],
                        {
                            easing: verticalEasing,
                            duration: this.duration,
                            iterations: 1,
                        }
                    );
                    horizontalDom.animate([{ transform: 'translate3d(' + offsetX + 'px, 0, 0)' }], {
                        easing: 'linear',
                        duration: this.duration,
                        iterations: 1,
                    });
                    verticalAnimate.onfinish = function () {
                        verticalDom.remove();
                    };
                }
            }

            const startHigh = document.getElementById('start-high');
            const startLow = document.getElementById('start-low');
            const cart = document.getElementById('cart');

            startHigh.onclick = function () {
                new MoveBall({
                    startDom: startHigh,
                    endDom: cart,
                    color: '#7dce82',
                }).freeThrow();
            };
            startLow.onclick = function () {
                new MoveBall({
                    startDom: startLow,
                    endDom: cart,
                    color: '#6ec1e4',
                }).freeThrow();
            };
        </script>
    </body>
</html>
